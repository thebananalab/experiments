<title>Cobee Onboarding IA</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: prototipo de móvil centrado (marco de teléfono en escritorio, pantalla completa en móvil).
   Tokens tomados de cobee.io: morado noche, verde neón, pasteles por categoría. */
:root{
  --bg:#FAF8FF; --surface:#FFFFFF; --ink:#131117; --muted:#645F78; --line:#E4E0F0;
  --brand:#221C46; --accent:#01EB5E; --on-accent:#221C46; --accent-ink:#177855; --focus:#4A19B5;
  --pastel-ink:#221C46; --danger:#B30100; --shadow:0 18px 50px rgba(34,28,70,.12);
  --display:"Outfit","TT Travels",Arial,Verdana,sans-serif; --body:"Figtree",Arial,Verdana,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* escala tipográfica. Outfit solo para cifras y títulos; Figtree para el resto. Pesos: 400, 500 y 600 */
  --fs-hero:56px; --fs-hero-w:72px; --fs-punch:40px; --fs-title:28px; --fs-sub:20px; --fs-body:16px; --fs-small:14px; --fs-label:11px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150E2E; --surface:#221C46; --ink:#FAF8FF; --muted:#B9B3D6; --line:#3A3262;
  --accent-ink:#01EB5E; --focus:#96F7D4; --danger:#FF7375; --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150E2E; --surface:#221C46; --ink:#FAF8FF; --muted:#B9B3D6; --line:#3A3262;
  --accent-ink:#01EB5E; --focus:#96F7D4; --danger:#FF7375; --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-body);line-height:1.45;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* capa de IA */
.think{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:64px 16px}
.walk{height:170px;width:auto;display:block;margin-bottom:12px}
.dizzy{position:relative;width:132px;height:112px;margin-bottom:8px;perspective:500px;animation:wob 1.6s ease-in-out infinite}
.dizzy img{width:120px;height:auto;margin:6px;display:block;animation:flip 2.2s ease-in-out infinite;transform-origin:50% 50%}
.dizzy .sp{position:absolute;font-style:normal;line-height:1;opacity:0;animation:twk 1.5s ease-in-out infinite}
.dizzy .s1{left:-4px;top:6px;font-size:20px;color:#01EB5E;animation-delay:0s}
.dizzy .s2{right:-6px;top:0;font-size:16px;color:#FFDC37;animation-delay:.3s}
.dizzy .s3{right:-12px;top:52px;font-size:22px;color:#FF7375;animation-delay:.6s}
.dizzy .s4{left:-12px;top:60px;font-size:14px;color:#17CCF9;animation-delay:.9s}
.dizzy .s5{left:48px;top:-14px;font-size:18px;color:#01EB5E;animation-delay:1.2s}
@keyframes flip{0%{transform:rotateY(0)}70%,100%{transform:rotateY(360deg)}}
@keyframes wob{0%,100%{transform:rotate(-9deg) translateY(0)}25%{transform:rotate(7deg) translateY(-7px)}50%{transform:rotate(-6deg) translateY(2px)}75%{transform:rotate(10deg) translateY(-5px)}}
@keyframes twk{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1.15) rotate(90deg)}100%{opacity:0;transform:scale(.3) rotate(180deg)}}
.note{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:var(--fs-small);color:var(--muted)}
.note em{font-style:normal;font-weight:600}
.note textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;resize:none}
.note small{font-size:var(--fs-label)}
.aichip{display:inline-block;margin-top:8px;font-size:var(--fs-label);font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:3px 10px}
.aichip.off{background:var(--line);color:var(--muted)}
#cmp{max-height:320px;font:12px/1.45 var(--body)}
.cmpt{width:100%;border-collapse:collapse}
.cmpt th,.cmpt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.cmpt th{color:var(--ink);font-weight:600}
#ailog{max-height:300px;font:11px/1.5 var(--mono)}
#ailog pre{white-space:pre-wrap;margin:4px 0 10px;color:var(--muted)}
#ailog .tr b{color:var(--ink)}
/* barra de prototipo */
.proto{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:center;font-size:var(--fs-label);color:var(--muted);opacity:.7;transition:opacity .2s}
.proto:hover,.proto:focus-within{opacity:1}
.proto label{display:flex;align-items:center;gap:4px}
.proto select{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px dotted var(--muted);padding:2px 0;min-width:0;cursor:pointer}
.proto button{font-size:var(--fs-label);color:inherit;text-decoration:underline;text-underline-offset:3px}
.log{display:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-height:130px;overflow:auto;font:11px/1.5 var(--mono);color:var(--muted)}
.log.open{display:block}
.log b{color:var(--ink);font-weight:600}

/* marco */
.phone{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:32px;overflow:hidden;
  height:min(780px,calc(100dvh - 70px));min-height:560px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.back[hidden]{display:none}
.stepinfo{flex:1;min-width:0}
.steplabel{font-size:var(--fs-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .35s}
main{flex:1;overflow:auto;scrollbar-gutter:stable;padding:14px 20px 20px;display:flex;flex-direction:column;gap:16px}
main>*{flex-shrink:0}
.foot{padding:12px 20px 18px;border-top:1px solid var(--line);background:var(--bg)}
.btn{width:100%;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:var(--fs-body);border-radius:999px;padding:15px 24px;font-family:var(--body)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;border:2px solid var(--ink);color:var(--ink)}
h1{font-size:var(--fs-title);line-height:1.15}
.lead{color:var(--muted);margin:6px 0 0}
.fade{animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* paso 1 */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:104px;transition:border-color .15s,background .15s}
.goal .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--pastel-ink)}
.goal .ic.big{width:48px;height:46px;border-radius:0;background:none}
.goal .ic.big img{width:46px;height:auto;display:block}
.goal strong{font-family:var(--display);font-weight:600;font-size:var(--fs-body);letter-spacing:.02em}
.goal small{color:var(--muted);font-size:var(--fs-small);line-height:1.3}
.goal[aria-pressed="true"]{border-color:var(--accent-ink)}
.goal .badge{position:absolute;top:10px;right:10px;font-size:var(--fs-label);font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:2px 8px}
.gcount{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:var(--fs-small);color:var(--muted)}
.gd{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.gd.on{background:var(--accent);border-color:var(--accent)}
.gcount span:last-child{margin-left:4px}
.hint{font-size:var(--fs-small);color:var(--muted);min-height:20px}

/* paso 2 */
.fixed{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fixed h3{font-size:var(--fs-body);color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.fixed .r{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.fixed .r b{font-family:var(--display);font-size:var(--fs-sub);font-weight:600}
.q{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 4px 16px rgba(34,28,70,.08)}
.q .qt{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.q .qt .info{margin-top:2px}
.q .tip{background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:var(--fs-small);line-height:1.4}
.q .tagline{font-size:var(--fs-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q h2{font-size:var(--fs-sub);line-height:1.2}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:500;font-size:var(--fs-body)}
.opt[aria-checked="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.frows{display:flex;flex-direction:column;gap:10px}
.frow{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-small);color:var(--muted)}
.frow select{font:inherit;font-size:var(--fs-body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 10px;width:100%}
.frow select:focus-visible{border-color:var(--accent)}
.qsub{font-size:var(--fs-small);color:var(--muted);margin:-2px 0 0}
.multi{font-size:var(--fs-small);color:var(--muted);margin:-4px 0 0;display:block}
.opt.skip{border:0;background:none;padding:9px 4px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:var(--fs-small)}
.opt.skip[aria-checked="true"]{background:none;color:var(--ink);font-weight:600}
.follow{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.follow h3{font-family:var(--body);font-weight:600;font-size:var(--fs-body);letter-spacing:0}
.use{font-size:var(--fs-small);color:var(--muted);margin:0}

/* paso 3: una tarjeta = nombre, cifra, un dato editable y un enlace. El detalle va en "¿Por qué?" */
.hero{display:flex;flex-direction:column;gap:4px}
.hero .kick{font-size:var(--fs-body);color:var(--muted)}
.total{font-family:var(--display);font-weight:600;font-size:var(--fs-hero);line-height:1.05;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.total small{font-size:var(--fs-sub);font-weight:500;color:var(--muted);letter-spacing:.02em}
.sub{font-size:var(--fs-small);color:var(--muted)}
.gift{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.gift .bubble{width:36px;height:36px}
.gift b{display:block;font-size:var(--fs-body)}
.gift span{font-size:var(--fs-small);color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:10px}
.grp{font-size:var(--fs-small);font-weight:600;color:var(--ink);margin:10px 2px -2px}
.grp span{font-weight:400;color:var(--muted)}
.grp span::before{content:"· "}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:opacity .2s}
.card.off{opacity:.55}
.card .row{display:flex;align-items:center;gap:8px}
.card .row .bubble{margin-right:4px}
.bubble img{width:26px;height:auto;display:block}
.bubble{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--pastel-ink)}
.hd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{display:flex;align-items:center;gap:6px}
.card h3{font-size:var(--fs-body);line-height:1.25}
.info{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:600 14px/1 var(--display);display:grid;place-items:center;flex:none}
.info[aria-expanded="true"]{background:var(--bg);border-color:var(--ink);color:var(--ink)}
.chev{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink);background:var(--bg);border:1.5px solid var(--muted);transition:transform .2s;position:relative}
.chev[aria-expanded="true"]{transform:rotate(180deg)}
.more{display:flex;flex-direction:column;gap:8px;padding-left:48px}
.more[hidden]{display:none}
.amt{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 6px}
.amt .v{font-family:var(--display);font-weight:600;font-size:var(--fs-sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt .per{font-size:var(--fs-small);color:var(--muted)}
.tag{font-size:var(--fs-label);font-weight:600;color:#221C46;background:#E3E2FA;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.paid{background:#C7FCCA}
.tag.trial{background:#FFCCEA}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--brand)}
.est[hidden]{display:none}
.est{display:flex;align-items:center;gap:6px;font-size:var(--fs-small);color:var(--muted);flex-wrap:wrap}
.link{color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:var(--fs-small)}
.whylink{align-self:flex-start;font-size:var(--fs-small);color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.stepper{display:none;align-items:center;gap:12px}
.stepper.open{display:flex}
.stepper button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);font-size:var(--fs-sub);line-height:1;display:grid;place-items:center}
.stepper .link{width:auto;height:auto;border:0;border-radius:0;font-size:var(--fs-small);margin-left:auto;display:inline}
.stepper output{font-weight:600;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.tip{background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:var(--fs-small);line-height:1.45;display:flex;flex-direction:column;gap:6px}
.tip[hidden]{display:none}
.tip p{margin:0}
.tip .warn{font-size:var(--fs-small)}
.tip .fine{font-size:var(--fs-small);color:inherit;opacity:.8}
.tip b{color:var(--ink);font-weight:600}
.coachon .card:first-of-type .chev{animation:pulse 1.6s ease-in-out 3}
.bub{position:absolute;top:calc(100% + 8px);right:-6px;background:var(--ink);color:var(--bg);font:500 12px/1 var(--body);padding:7px 10px;border-radius:10px;white-space:nowrap;z-index:2;pointer-events:none}
.bub.up{top:auto;bottom:calc(100% + 8px);right:-4px}
.bub.up::before{top:auto;bottom:-4px;right:14px}
.bub::before{content:"";position:absolute;top:-4px;right:18px;width:8px;height:8px;background:var(--ink);transform:rotate(45deg)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(1,235,94,.7)}60%{box-shadow:0 0 0 8px rgba(1,235,94,0)}}
.foot-note{font-size:var(--fs-small);color:var(--muted);margin:0}
.foot-note summary{cursor:pointer;color:var(--accent-ink);font-weight:600}
.foot-note p{margin:6px 0 0}

/* wrapped */
.wrapped{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background-color:var(--w-bg);background-size:cover;background-position:center bottom;background-repeat:no-repeat;color:var(--w-fg)}
.wrapped[hidden]{display:none}
.segs{display:flex;gap:5px;padding:16px 16px 8px}
.seg{flex:1;height:4px;border-radius:4px;background:var(--w-soft);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--w-fg)}
.seg.done i{width:100%}
.seg.cur i{animation:fill 5s linear forwards}
.paused .seg.cur i{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.wtools{display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:var(--fs-label);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.wtools button{width:36px;height:36px;border-radius:50%;background:var(--w-soft);color:var(--w-fg);display:grid;place-items:center}
.slide{flex:none;padding:8px 24px 0;display:flex;flex-direction:column;justify-content:flex-start;gap:14px;animation:in .4s ease both}
.slide .big{font-family:var(--display);font-weight:600;font-size:var(--fs-hero-w);line-height:1.05;letter-spacing:0;font-variant-numeric:tabular-nums}
.slide .big .eur{font-size:.55em;font-weight:500;margin-left:.08em}
.slide .eq{font-family:var(--display);font-weight:600;font-size:var(--fs-punch);line-height:1.1;letter-spacing:0}
.slide h2{font-size:var(--fs-title);line-height:1.15}
.slide .wsub{color:inherit;font-family:var(--body);font-weight:500;font-size:var(--fs-sub);line-height:1.3;letter-spacing:0;margin:0}
.slide .wafter{font-family:var(--display);font-weight:600;font-size:var(--fs-punch);line-height:1.1;letter-spacing:0;margin:0}
.slide .lbl{font-size:var(--fs-label);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:0}
.slide .note{font-size:var(--fs-small);line-height:1.4;opacity:.85}
.slide p{margin:0;font-size:var(--fs-body);line-height:1.5}
.bd{display:flex;flex-direction:column;gap:14px}
.bd .l{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-body);font-weight:500;margin-bottom:5px}
.bd .l span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.bd .tr{height:10px;background:var(--w-soft);border-radius:10px;overflow:hidden}
.bd .tr i{display:block;height:100%;background:var(--w-fg);border-radius:10px}
.chip{align-self:flex-start;background:var(--w-fg);color:var(--w-bg);border-radius:999px;padding:8px 16px;font-weight:600}
.art{flex:1;min-height:160px;position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.artimg{width:100%;height:100%;background-size:contain;background-position:center bottom;background-repeat:no-repeat;-webkit-mask-image:radial-gradient(ellipse 74% 74% at 50% 54%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 74% 74% at 50% 54%,#000 58%,transparent 100%)}
.art.left{justify-content:flex-end;padding-right:14px}
.art.left .artimg{width:60%;height:88%}
.artvid{height:96%;aspect-ratio:9/16;object-fit:contain;display:block}
/* última story: ilustración recortada, sin fondo; solo se difuminan los lados para integrarla */
.art.big .artimg{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 14%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 14%);mask-composite:intersect;transform:scale(1.06);transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite}
/* el arte entra con el mismo fundido que el texto; en la story 2 la ilustración aparece con un pequeño rebote y flota */
.art{animation:in .4s ease both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.88)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(1.4deg)}}
@media (prefers-reduced-motion:no-preference){.art.fl .artimg{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both,floaty 4.2s ease-in-out .6s infinite}}
@media (prefers-reduced-motion:reduce){.art{animation:none}}
@keyframes bob{0%,100%{transform:scale(1.06) translateY(0)}50%{transform:scale(1.06) translateY(-6px)}}
.conf{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}
.conf[hidden]{display:none}
.wbtns{display:flex;flex-direction:column;gap:10px;padding:8px 24px 24px}
.wbtns .btn{background:var(--w-fg);color:var(--w-bg)}
.wbtns .btn.ghost{background:transparent;border-color:var(--w-fg);color:var(--w-fg)}
.allbtn{align-self:center;font-size:var(--fs-body)}
.allbtn[hidden]{display:none}
.allb{display:flex;flex-direction:column;gap:8px}
.allb[hidden]{display:none}
.more-b{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:14px 16px}
.more-b .bubble{margin-right:4px}
.more-b .mb{flex:1;min-width:0;display:flex;flex-direction:column}
.more-b b{font-size:var(--fs-body)}
.more-b span{font-size:var(--fs-small);color:var(--muted)}
.more-b em{font-style:normal;font-size:var(--fs-small);font-weight:600;color:var(--accent-ink)}
.addb{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:var(--fs-small);flex:none}
.todos{display:flex;flex-direction:column;gap:8px}
.todo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.todo .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--on-accent)}
.todo.done .ck{background:var(--accent);border-color:var(--accent)}
.todo b{display:block;font-size:var(--fs-body)}
.todo .sub{display:block;font-size:var(--fs-small);color:var(--muted)}
.todo.done b{color:var(--muted);text-decoration:line-through}
.later{display:block;margin:10px auto 0;font-size:var(--fs-small);color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.later:disabled{text-decoration:none;cursor:default}
.endimg{width:100%;max-width:220px;height:auto;align-self:center;border-radius:24px}
/* pantalla final siempre en claro (también con tema oscuro) para que la ilustración se vea bien */
.end{--bg:#F5F3FE;--surface:#FFFFFF;--ink:#131117;--muted:#645F78;--line:#E4E0F0;--accent-ink:#177855;color:var(--ink);position:absolute;inset:0;z-index:6;background:var(--bg);display:flex;flex-direction:column}
.end[hidden]{display:none}
@media (max-width:480px){
  .phone{border-radius:24px;height:calc(100dvh - 40px);min-height:0}
  /* en móvil se oculta el panel de personalización del prototipo */
  .proto{display:none}
:root{--fs-title:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
const $=s=>document.querySelector(s);
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" €";
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const NAME="Marta";

const ICON={
  transporte:'<rect x="4" y="3.5" width="16" height="13" rx="3"/><path d="M4 11h16M8 20v-3.5M16 20v-3.5"/>',
  comida:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 4-3 8h3"/>',
  descuentos:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',
  seguro:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/>',
  formacion:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/>',
  bienestar:'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>',
  guarderia:'<circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3-6 7-6s7 2 7 6"/>',
  pensiones:'<path d="M4 18V8l8-5 8 5v10M4 18h16M9 18v-6h6v6"/>',
  reconocimiento:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.3l-5.5 3 1-6.2L3 9.7l6.2-.9z"/>',
  ahorrar:'<circle cx="12" cy="12" r="8.5"/><path d="M15 8.8a3.6 3.6 0 1 0 0 6.4M7.5 11h5.5M7.5 13.2h5.5"/>',
  crecer:'<path d="M4 17l6-6 4 4 6-8M15 7h5v5"/>',
  pause:'<path d="M8 5v14M16 5v14"/>', play:'<path d="M7 4l13 8-13 8z"/>'
};
ICON.disfrutar='<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 7v10" stroke-dasharray="2 2"/>';
const ico=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

const GOALS=[
  {id:"ahorrar",name:"Ahorrar",desc:"Que me cunda más el sueldo",ic:"ahorrar",pastel:"#C7FCCA",label:"Ahorro estratégico",set:"green"},
  {id:"salud",name:"Salud",desc:"Cuidarme sin que cueste tanto",ic:"seguro",pastel:"#FCC1BE",label:"Salud primero",set:"mint"},
  {id:"crecer",name:"Crecer",desc:"Aprender y avanzar",ic:"crecer",pastel:"#C3EBFB",label:"En modo crecimiento",set:"light"},
  {id:"familia",name:"Familia",desc:"Apoyo para los míos",ic:"guarderia",pastel:"#FDEEC1",label:"Familia en el centro",set:"light"},
  {id:"futuro",name:"Futuro",desc:"Tranquilidad a largo plazo",ic:"pensiones",pastel:"#E3E2FA",label:"Mirada a largo plazo",set:"dark"},
  {id:"disfrutar",name:"Disfrutar",desc:"Más planes por menos",ic:"disfrutar",pastel:"#FFCCEA",label:"Más planes por menos",set:"mint"}
];
const G=id=>GOALS.find(g=>g.id===id);
/* objetivos con icono 3D de Cobee (el de Futuro/pensiones se generó en el mismo estilo) */
const GIMG={ahorrar:"descuentos-empleados",salud:"seguro-salud",crecer:"plan-formacion",familia:"ticket-guarderia",futuro:"plan-pensiones",disfrutar:"ticket-restaurante"};
const goalIcon=g=>GIMG[g.id]?`<span class="ic big"><img src="assets/benefit-${GIMG[g.id]}.webp" alt="" width="46" height="45"></span>`:`<span class="ic" style="background:${g.pastel}">${ico(g.ic)}</span>`;

/* topes del simulador de Cobee: comida 11 €/día, máx. 220 €/mes y 11 meses; transporte máx. 136 €/mes */
const COMIDA_DIA=11, COMIDA_MAX=220, TRANSPORTE_MAX=136, SEGURO_MAX=500, MESES=11;
/* estimados por perfil (tramo de IRPF) para beneficios fuera del simulador.
   Supuestos ilustrativos, pendientes de validar con datos de uso de Cobee y con el equipo fiscal. */
const EST={24:{desc:150,gym:30,pen:50},30:{desc:200,gym:40,pen:100},37:{desc:250,gym:50,pen:125},45:{desc:300,gym:60,pen:125}};
const DESC_PCT=0.05, GYM_PCT=0.20, PEN_MAX=1500;
const est=()=>EST[Math.round(s.t*100)];
/* planes de Wellhub en España (wellhub.com, precios "desde", oct. 2026). La IA propone uno según los objetivos */
const WELLHUB={starter:{n:"Starter",p:9.99,apps:47},basic:{n:"Basic",p:22.99,apps:54},silver:{n:"Silver",p:36.99,apps:56}};
const whPlan=()=>s.goals.includes("salud")?WELLHUB.basic:WELLHUB.starter;
const eur2=n=>n.toFixed(2).replace(".",",")+" €";
/* catálogo activo según el plan de Cobee de la empresa (página de precios de Cobee):
   Starter: comida, transporte, guardería, seguro y descuentos · Professional: + formación y gimnasio/bienestar · Premium: + plan de pensiones.
   La IA solo recomienda, y solo pregunta por, beneficios de este catálogo (reglas 3 y "restricción dura") */
const CATALOGO={starter:["transporte","comida","guarderia","seguro","descuentos"],
  professional:["transporte","comida","guarderia","seguro","descuentos","formacion","bienestar"],
  premium:["transporte","comida","guarderia","seguro","descuentos","formacion","bienestar","pensiones"]};
const activo=id=>CATALOGO[s.cat].includes(id);
/* 4.2: lo que responden empleados con un perfil parecido (prototipo: datos sintéticos; en producción salen de Mixpanel) */
function priors(q){
  const t=Math.round(s.t*100);
  return {AH:{"Seguro médico":.25,"Guardería":.1,"Un curso que pago o voy a pagar":.1,"Ninguno":.55},
    SA:{"Sí, lo pago yo":.25,"Sí, me lo paga la empresa":.2,"No":.55},
    CR:{"Sí":.3,"Aún no lo sé":.45,"No":.25},
    FA:{"Sí":.2,"No":.8},
    FU:t===24?{"No":.9,"Sí":.1}:{"No":.65,"Sí":.35}}[q.id];
}
const UMBRAL_VALOR=50, UMBRAL_IGUAL=.85;
/* descuentos: la IA elige qué marcas asociadas enseñar según los objetivos (marcas que Cobee publica en su web).
   Cobee publica descuentos de "hasta un 11 %"; el 5 % medio es un supuesto. */
const BRANDS={ahorrar:["Carrefour","Amazon","Cepsa"],familia:["Carrefour","Primark","Atrápalo"],salud:["Nike","Rituals"],
  crecer:["Amazon"],futuro:["Airbnb","Atrápalo"],disfrutar:["Atrápalo","Airbnb","Lastminute"]};
/* no se muestran marcas que revelen algo personal (embarazo, bebés, salud). Elegir Familia no significa tener hijos pequeños. */
function brands(){const out=[];const l=s.goals.map(g=>BRANDS[g]||[]),a=l[0]||[],b=l[1]||[];[a[0],a[1],b[0],a[2],b[1],b[2],"Amazon","Carrefour"].filter(Boolean).forEach(b=>{if(!out.includes(b)&&out.length<3)out.push(b);});return out;}

/* prorrateo: los beneficios se aplican desde la nómina del mes siguiente al alta hasta diciembre.
   Si el alta es en diciembre, el plan se calcula para el año siguiente completo.
   Transporte, comida y guardería no cuentan agosto (vacaciones); comida tampoco julio en intensiva.
   La formación es un gasto puntual y no se prorratea. */
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const YEAR=new Date().getFullYear();
const startM=()=>s.alta+1>12?1:s.alta+1;
const nextYear=()=>s.alta+1>12;
let FULL=false;
function months(kind){
  let n=0;
  for(let m=FULL?1:startM();m<=12;m++){
    if(kind!=="all"&&m===8)continue;
    if(kind==="comida"&&s.mode==="intensiva"&&m===7)continue;
    n++;
  }
  return n;
}
const prorated=()=>!nextYear()&&startM()>1;
const period=()=>nextYear()?`en ${YEAR+1}`:startM()===1?`en ${YEAR}`:"hasta diciembre";
const MODES={
  presencial:{office:5,days:20,months:MESES,transporte:true,tNote:"",cNote:""},
  hibrido:{office:3,days:12,months:MESES,transporte:true,tNote:"Proporcional a tus días de oficina",cNote:""},
  remoto:{office:0,days:20,months:MESES,transporte:false,tNote:"",cNote:"Teletrabajo: exención pendiente de validar con el equipo fiscal"},
  intensiva:{office:5,days:20,months:MESES-1,transporte:true,tNote:"",cNote:"Sin julio por tu jornada intensiva (agosto ya cuenta como vacaciones)"}
};

/* Perfiles parecidos (datos sintéticos): % de empleados con tu misma modalidad que usa cada beneficio del día a día */
const COHORT={presencial:{n:1240,transporte:.82,comida:.74},hibrido:{n:968,transporte:.71,comida:.68},remoto:{n:512,comida:.55},intensiva:{n:344,transporte:.78,comida:.70}};
const COHORT_B={seguro:.31,guarderia:.12,formacion:.18,descuentos:.64,bienestar:.27,pensiones:.22};
const dec=p=>Math.max(1,Math.min(9,Math.round(p*10)));
function cohortLine(){const c=COHORT[s.mode],fx=fixedList(),d=fx.map(id=>dec(c[id])),lo=Math.min(...d),hi=Math.max(...d);return `${lo===hi?lo:lo+"-"+hi} de cada 10 como tú ${fx.length>1?"los usan":"lo usan"}`;}
const MO=[["Hasta 30 €",25],["30–45 €",40],["Más de 45 €",55]];
const GU=[["Hasta 300 €",250],["300–500 €",400],["Más de 500 €",650]];
const FOR=[["Hasta 1.000 €",600],["1.000–3.000 €",2000],["Más de 3.000 €",4000]];
/* cada pregunta mide una variable del cálculo: situación + importe en rangos */
const QB=[
  {id:"AH",sub:"Así vemos cuánto podrías ahorrar en lo que ya pagas.",goal:"ahorrar",multi:true,text:"¿Qué gastos pagas de tu bolsillo hoy?",use:"Estos gastos puedes pagarlos desde tu nómina y pagar menos impuestos. Marca todos los que apliquen y elegimos los que más te ahorran.",
    opts:["Seguro médico","Guardería","Un curso que pago o voy a pagar","Ninguno"],
    follow:{"Seguro médico":{text:"¿Cuánto pagas al mes?",opts:MO},"Guardería":{text:"¿Cuánto pagas al mes?",opts:GU},"Un curso que pago o voy a pagar":{text:"¿Cuánto te queda por pagar este año?",opts:FOR}}},
  {id:"SA",sub:"Así sabemos si te conviene pagar tu seguro con Cobee.",goal:"salud",sensitive:true,text:"¿Pagas tú un seguro médico privado?",use:"Si ya lo pagas, lo pasas a Cobee y ahorras. Si no, te decimos cuánto ahorrarías al contratarlo.",
    opts:["Sí, lo pago yo","Sí, me lo paga la empresa","No"],follow:{"Sí, lo pago yo":{text:"¿Cuánto pagas al mes?",opts:MO}}},
  {id:"CR",sub:"Así calculamos cuánto ahorrarías en tu formación.",goal:"crecer",text:"¿Vas a pagar alguna formación para tu trabajo este año?",use:"Solo cuenta lo que aún vas a pagar. Con el importe calculamos tu ahorro.",
    opts:["Sí","Aún no lo sé","No"],follow:{"Sí":{text:"¿Cuánto, más o menos?",opts:FOR}}},
  {id:"FA",sub:"Así sabemos si te proponemos la guardería y cuánto ahorrarías.",goal:"familia",sensitive:true,text:"¿Tienes hijos menores de 3 años?",use:"Solo si tienes hijos pequeños te proponemos la guardería. Con la cuota calculamos tu ahorro.",
    opts:["Sí","No"],follow:{"Sí":{text:"¿Cuánto pagas al mes de guardería?",opts:GU}}},
  {id:"FU",sub:"Así sabemos si te conviene empezar o aportar más.",goal:"futuro",text:"¿Aportas ya a un plan de pensiones?",use:"Así sabemos si te proponemos empezar un plan de pensiones o aportar algo más.",
    opts:["No","Sí"]}
];

/* estado */
let s,plan,evs,t0,SCN=0,runId=0;
function fresh(mode){return {step:0,goals:[],answers:{},mode,t:Number($("#tramo").value),alta:Number($("#alta").value),vals:{},on:{},open:{},tips:{},ans:{},cat:$("#catalogo").value,assumed:{},fold:{},extra:[],shown:{},coachDone:false,ai:{qs:null,recs:null,whyR:{},motQ:{},txtQ:{},dyn:{},trace:[],note:""}};}
const cur=()=>MODES[s.mode];
const T=()=>s.t;

/* catálogo: ahorro = importe × tipo marginal del tramo, con los límites del simulador de Cobee */
/* importe que dio el empleado para un beneficio (undefined si no respondió) */
function qv(qid){
  const q=QB.find(x=>x.id===qid),a=s.answers[qid];if(!q||!a)return undefined;
  if(q.vals&&q.vals[a]!==undefined)return q.vals[a];
  const f=q.follow&&q.follow[a],fa=s.answers[qid+"_f"];
  if(f){const o=f.opts.find(o=>o[0]===fa);if(o)return o[1];}
  return undefined;
}
const ahSel=(a=s.answers)=>String(a.AH||"").split("|").filter(Boolean);
const ahHas=(o,a=s.answers)=>ahSel(a).includes(o);
function qvAH(o,a=s.answers){const f=QB.find(x=>x.id==="AH").follow[o];if(!f)return undefined;const op=f.opts.find(x=>x[0]===a["AH_f_"+o]);return op?op[1]:undefined;}
function given(id){
  const a=s.answers;
  if(id==="seguro")return a.SA==="Sí, lo pago yo"?qv("SA"):ahHas("Seguro médico")?qvAH("Seguro médico"):undefined;
  if(id==="guarderia")return a.FA==="Sí"?qv("FA"):ahHas("Guardería")?qvAH("Guardería"):undefined;
  if(id==="formacion")return qv("CR")!==undefined?qv("CR"):ahHas("Un curso que pago o voy a pagar")?qvAH("Un curso que pago o voy a pagar"):undefined;
  return undefined;
}
/* lo que el empleado ya paga se presenta como traslado, no como contratación nueva */
function existing(id){
  const a=s.answers;
  if(id==="seguro")return a.SA==="Sí, lo pago yo"||ahHas("Seguro médico");
  if(id==="guarderia")return ahHas("Guardería")||given("guarderia")!==undefined;
  if(id==="formacion")return a.CR==="Sí"||ahHas("Un curso que pago o voy a pagar");
  if(id==="pensiones")return a.FU==="Sí";
  return false;
}
const B={
  transporte:{name:()=>"Transporte",pastel:"#C3EBFB",min:1,max:5,step:1,
    def:()=>cur().office,label:v=>`${v} día${v>1?"s":""} de oficina a la semana`,
    save:v=>TRANSPORTE_MAX*(v/5)*months("t")*T()},
  comida:{name:()=>"Comida",pastel:"#FDEEC1",min:1,max:20,step:1,
    def:()=>cur().days,label:v=>`Comes fuera ${v} días al mes`,
    save:v=>Math.min(v*COMIDA_DIA,COMIDA_MAX)*months("comida")*T()},
  descuentos:{name:()=>{const g=s.goals.find(x=>["ahorrar","crecer","disfrutar"].includes(x));return g==="ahorrar"||g==="crecer"?"Descuentos":g==="disfrutar"?"Planes y ocio":"Descuentos";},pastel:"#C7FCCA",est:true,min:50,max:800,step:50,
    def:()=>est().desc,label:v=>`Gastas ${v} € al mes en ${brands().join(", ")}`,save:v=>v*months("all")*DESC_PCT},
  seguro:{name:()=>"Seguro médico",pastel:"#FCC1BE",min:10,max:150,step:5,
    def:()=>given("seguro")??40,label:v=>`Pagas ${v} € al mes`,save:v=>Math.min(v*months("all"),SEGURO_MAX)*T()},
  guarderia:{name:()=>"Guardería",pastel:"#FDEEC1",min:100,max:900,step:25,
    def:()=>given("guarderia")??350,label:v=>`Pagas ${v} € al mes`,save:v=>v*months("t")*T()},
  formacion:{name:()=>"Formación",pastel:"#E3E2FA",min:200,max:12000,step:100,
    def:()=>given("formacion")??1000,label:v=>`${fmt(v)} en cursos al año`,save:v=>v*T()},
  /* bienestar = Wellhub en Cobee. No es retribución flexible (no ahorra IRPF): se muestra el plan que encaja y su precio */
  /* ahorro estimado = (cuota de un gimnasio por tu cuenta − precio de referencia del plan Wellhub) × meses.
     Gimnasio medio en España 30–50 €/mes y low cost desde 20 € (elDiario.es, ene. 2025). Editable */
  bienestar:{name:()=>"Wellhub",pastel:"#FFCCEA",est:true,min:10,max:100,step:5,
    def:()=>whPlan()===WELLHUB.basic?40:20,label:v=>`Si hoy pagas ${v} € al mes por un gimnasio · Wellhub ${whPlan().n} cuesta ${eur2(whPlan().p)}`,
    save:v=>Math.max(0,v-whPlan().p)*months("all")},

/* candidatos por objetivo, ordenados según respuestas */
function cand(g,a=s.answers){
  let l;
  if(g==="ahorrar"){
    /* Ahorrar = sacar más a lo que ya gastas: si no paga nada de la lista, no se le propone gastar más */
    /* puede marcar varios gastos: se proponen los de mayor ahorro estimado según las reglas */
    const map={"Seguro médico":"seguro","Guardería":"guarderia","Un curso que pago o voy a pagar":"formacion"};
    const mm=ahSel(a).map(o=>map[o]).filter(Boolean).filter(activo).sort((x,y)=>saveOf(y,true)-saveOf(x,true));
    l=ahHas("Ninguno",a)&&!mm.length?["descuentos"]:mm.length?[...mm,"descuentos"]:["seguro","formacion","descuentos","bienestar"];
  }else if(g==="salud"){
    l=a.SA==="Sí, me lo paga la empresa"?["bienestar","descuentos","formacion"]:["seguro","bienestar","descuentos"];
  }else if(g==="crecer"){l=a.CR==="No"?["descuentos","bienestar"]:["formacion","descuentos","bienestar"];}
  /* guardería solo si ha dicho que tiene hijos menores de 3 años; si no se preguntó, no se asume */
  else if(g==="familia"){l=a.FA==="Sí"||ahHas("Guardería",a)?["guarderia","seguro","bienestar"]:["seguro","bienestar","descuentos"];}
  else if(g==="futuro"){l=["pensiones","seguro","formacion","descuentos","bienestar"];}
  else{l=["descuentos","bienestar"];}
  return [...new Set(l)].filter(activo);
}
function fixedList(){const o=[];if(cur().transporte)o.push("transporte");o.push("comida");return o;}
function pickCustom(a0=s.answers){
  if(s.ai&&s.ai.recs&&!SCN)return s.ai.recs.filter(activo).map(id=>({id,kind:"ia",goal:s.goals[0]}));
  const a={...s.assumed,...a0};
  const n=4-fixedList().length, out=[], src={};
  const add=(id,g)=>{if(id&&out.length<n&&!out.includes(id)){out.push(id);src[id]=g;}};
  const gs=s.goals, lists=gs.map(g=>cand(g,a));
  if(gs.length===2){add(lists[0][0],gs[0]);add(lists[1].find(x=>!out.includes(x)),gs[1]);}
  gs.forEach((g,i)=>lists[i].forEach(id=>add(id,g)));
  if(!(gs.length===1&&gs[0]==="ahorrar"&&ahHas("Ninguno",a)))["descuentos","seguro","bienestar","formacion"].filter(activo).filter(id=>fitsGoals(id).length).forEach(id=>add(id,gs[0]));
  return out.map(id=>({id,kind:"ia",goal:src[id]}));
}
function buildPlan(){
  /* guardarraíl: un beneficio aparece una sola vez. Si uno añadido desde "Ver todos" pasa a ser propuesto, se descarta el añadido */
  const base=[...fixedList().map(id=>({id,kind:"fijo"})),...pickCustom()].filter((it,i,a)=>a.findIndex(x=>x.id===it.id)===i);
  const seen=new Set(base.map(x=>x.id));
  s.extra=[...new Set(s.extra||[])].filter(id=>!seen.has(id)&&activo(id));
  plan=[...base,...s.extra.map(id=>({id,kind:"extra"}))];
  plan.forEach(it=>{if(s.on[it.id]===undefined)s.on[it.id]=true;});
}

/* preguntas: reglas fijas 7.4 (máx. 2, una por objetivo, máx. 1 sensible)
   + solo se pregunta si alguna respuesta cambia los beneficios o mueve el ahorro ≥ 100 € */
/* si FA ya va a preguntar por los hijos, AH no repite guardería */
/* regla 4 y 5: AH no repite lo que pregunta otro objetivo ni añade una segunda pregunta sensible (hijos),
   y no ofrece gastos cuyo beneficio la empresa no tiene (regla 3) */
function optsOf(q){
  if(q.id!=="AH")return q.opts;
  const g=s.goals;
  return q.opts.filter(o=>!(o==="Seguro médico"&&(g.includes("salud")||!activo("seguro")))
    &&!(o==="Guardería"&&(g.includes("familia")||g.includes("salud")||!activo("guarderia")))
    &&!(o==="Un curso que pago o voy a pagar"&&(g.includes("crecer")||!activo("formacion"))));
}
const isSensitive=q=>q.sensitive||(q.id==="AH"&&optsOf(q).includes("Guardería"));
function scenario(a){
  const keep=s.answers;s.answers=a;SCN++;
  const ids=[...fixedList(),...pickCustom(a).map(x=>x.id)];
  const tot=ids.reduce((t,id)=>t+saveOf(id,true),0);
  SCN--;s.answers=keep;return {ids:ids.join(","),tot};
}
/* 4.2: valor = probabilidad de que la respuesta cambie la recomendación × diferencia de ahorro.
   Base = la respuesta más probable entre perfiles parecidos. Un cambio de beneficio cuenta como 100 € de diferencia mínima. */
function evaluate(q){
  const pr=priors(q),opts=optsOf(q).filter(o=>pr[o]!==undefined);
  const sum=opts.reduce((t,o)=>t+pr[o],0)||1;
  const likely=opts.reduce((m,o)=>pr[o]>pr[m]?o:m,opts[0]);
  const pmax=pr[likely]/sum;
  const variants=o=>{const f=q.follow&&q.follow[o];return f?f.opts.map(x=>({a:{[q.id]:o,[q.id+(q.multi?"_f_"+o:"_f")]:x[0]},w:1/f.opts.length})):[{a:{[q.id]:o},w:1}];};
  const base=scenario({[q.id]:likely});
  let value=0;
  opts.forEach(o=>variants(o).forEach(({a,w})=>{const r=scenario(a);const d=Math.abs(r.tot-base.tot)+(r.ids!==base.ids?100:0);if(d>0)value+=pr[o]/sum*w*Math.max(d,r.ids!==base.ids?100:0);}));
  return {likely,pmax,value:Math.round(value)};
}
/* reglas 1, 5, 7 y 8: una pregunta por objetivo, en orden de prioridad (el principal primero), máx. 2 y máx. 1 sensible */
const qById=id=>QB.find(q=>q.id===id)||(s.ai&&s.ai.dyn&&s.ai.dyn[id]);
function questions(){
  if(s.ai&&s.ai.qs)return s.ai.qs.map(qById).filter(Boolean);
  return rulesQuestions();
}
function rulesQuestions(){
  const out=[];s.assumed={};
  s.goals.forEach(g=>{
    const q=QB.find(q=>q.goal===g);if(!q)return;
    const ev=evaluate(q);
    if(ev.pmax>=UMBRAL_IGUAL){s.assumed[q.id]=ev.likely;return;}
    if(ev.value<UMBRAL_VALOR)return;
    if(isSensitive(q)&&out.some(isSensitive)){return;}
    out.push(q);
  });
  return out.slice(0,2);
}
const done=q=>{const a=s.answers[q.id];if(a===undefined)return false;if(a==="")return true;if(q.multi)return ahSel().every(o=>!(q.follow&&q.follow[o])||s.answers["AH_f_"+o]!==undefined);return !(q.follow&&q.follow[a])||s.answers[q.id+"_f"]!==undefined;};

/* explicaciones: en producción las redacta el LLM de Anthropic con el contexto del empleado.
   Aquí son plantillas que citan cifras ya calculadas por las reglas (la IA no calcula). */

  if(s.ai&&s.ai.whyR&&s.ai.whyR[it.id])return s.ai.whyR[it.id];
  const id=it.id,a=s.answers,m=cur(),v=val(id),sv=saveOf(id,true),y=fmt(sv),has=given(id)!==undefined,cuotas=(sv/Math.max(v,1)).toFixed(1).replace(".",",");

    comida:()=>s.mode==="remoto"
      ?`Comes en casa entre semana, así que también cuenta: con ${v} días al mes ahorras ${y} al año. La cifra se confirma al activarlo.`
      :s.mode==="intensiva"
      ?`Tu jornada intensiva deja fuera julio, ya descontado: con ${v} días al mes ahorras ${y} al año.`
      :`Con ${v} días al mes comiendo fuera, pagar con la tarjeta restaurante te ahorra ${y} al año.`,
    descuentos:()=>{const b=brands();return `Descuentos de hasta el 11 % en ${b.slice(0,-1).join(", ")} y ${b.at(-1)}. Si gastas ${v} € al mes, ahorrarías unos ${y} al año. No es ahorro fiscal: es un descuento, por eso es una estimación.`;},
    seguro:()=>existing("seguro")
      ?`${has?`Pagas unos ${v} € al mes por tu seguro.`:"Ya pagas tu seguro."} Pagarlo con Cobee sale antes de impuestos: ahorras ${y} al año con la misma cobertura.`
      :a.SA==="No"
      ?`Aún no tienes seguro privado. Contratarlo desde la nómina te ahorra ${y} al año frente a hacerlo por tu cuenta.`
      :`Pagar el seguro desde la nómina te sale más barato: ahorras ${y} al año.`,
    guarderia:()=>has
      ?`Pagas unos ${v} € al mes de guardería. Sin cambiar de guardería, pagarla desde la nómina te ahorra ${y} al año.`
      :`La guardería suele ser el mayor gasto fijo con un peque. Pagarla desde la nómina te ahorra ${y} al año.`,
    formacion:()=>has
      ?`Te quedan unos ${fmt(v)} de formación por pagar. Con Cobee te cuesta ${fmt(v-sv)}: el resto (${y}) lo ahorras en impuestos.`
      :a.CR==="Aún no lo sé"
      ?`Si haces un curso de ${fmt(v)} para tu trabajo, pagarlo con Cobee te ahorra ${y}. Ajusta el importe.`
      :`Con ${fmt(v)} al año en formación, te cuesta ${fmt(v-sv)}: el resto (${y}) lo ahorras en impuestos.`,
    bienestar:()=>{const w=whPlan();return `Wellhub te da gimnasios y apps de bienestar desde ${eur2(w.p)} al mes. No es ahorro fiscal: lo comparamos con un gimnasio de ${v} € al mes y ahorrarías unos ${y} al año. Sin permanencia y con 7 días gratis.`;},
    pensiones:()=>existing("pensiones")
      ?`Si aportas ${v} € más al mes, pagas menos impuestos hoy: unos ${y} al año. Los pagarás al rescatarlo, por eso es una estimación.`
      :`Aportar ${v} € al mes reduce tus impuestos de hoy en unos ${y} al año. Los pagarás al rescatarlo, por eso es una estimación.`,
    reconocimiento:()=>"No ahorra impuestos, pero se nota en cómo vives tu trabajo.",
  };
  return f[id]();
}
function note(it){
  if(it.id==="comida"&&s.mode==="remoto")return cur().cNote;
  if(it.id==="bienestar")return "Wellhub no ahorra impuestos, pero por Cobee sale más barato. Tu empresa puede pagar una parte; si mejoras el plan, pagas la diferencia.";
  if(it.id==="descuentos")return "Los descuentos se usan desde hoy, sin tocar tu nómina.";
  if(it.id==="formacion")return "Tiene que estar relacionada con tu trabajo. Cobee la paga al centro. Lo que ya has pagado no cuenta.";
  if(it.id==="guarderia")return "Si ya aplicas la deducción por maternidad por guardería (hasta 1.000 €), tu ahorro real puede ser algo menor.";
  if(it.id==="seguro"&&val("seguro")*12>SEGURO_MAX)return `Tu seguro cuesta ${fmt(val("seguro")*12)} al año; el ahorro cuenta hasta ${SEGURO_MAX} €, el máximo exento.`;
  return "";
}

main.addEventListener("change",e=>{
  const sl=e.target.closest("select[data-fk]");if(!sl)return;
  const q=qById(sl.dataset.q),k=sl.dataset.fk,v=sl.value==="__skip"?"":sl.value;
  s.answers[k]=v;
  if(q.gen&&k===q.id){if(v===""||q.vals[v]===undefined)delete s.vals[q.benefit];else s.vals[q.benefit]=q.vals[v];}
  track("question_answered",{pregunta:q.id,importe:v===""?null:v,prefiero_no_decirlo:v==="",generada_por_ia:!!q.gen});

main.addEventListener("click",e=>{
  const b=e.target.closest(".goal");
  if(b){
    const id=b.dataset.id,i=s.goals.indexOf(id);
    if(i>-1)s.goals.splice(i,1);
    else if(s.goals.length<2)s.goals.push(id);
    else{const old=s.goals[1];s.goals[1]=id;syncGoals();$("#hint").textContent=`Listo: cambiamos ${G(old).name} por ${G(id).name}.`;return;}
    syncGoals();return;
  }
  const o=e.target.closest(".opt");
  if(o){
    const q=qById(o.dataset.q),key=o.dataset.k,skip=o.dataset.skip==="1",v=skip?"":o.dataset.v;
    if(key===q.id&&q.multi){
      const sel=skip?[]:ahSel();
      if(!skip){const i=sel.indexOf(v);if(i>-1)sel.splice(i,1);else{if(v==="Ninguno")sel.length=0;else{const n=sel.indexOf("Ninguno");if(n>-1)sel.splice(n,1);}sel.push(v);}}
      Object.keys(s.answers).filter(k=>k.startsWith("AH_f_")&&!sel.includes(k.slice(5))).forEach(k=>delete s.answers[k]);
      s.answers.AH=skip?"":sel.join("|");
      if(!skip&&!sel.length)delete s.answers.AH;
      track("question_answered",{pregunta:q.id,respuesta:skip?null:sel.join("|"),prefiero_no_decirlo:skip});
    }else if(key===q.id&&q.gen){
      s.answers[q.id]=v;
      if(skip||q.vals[v]===undefined)delete s.vals[q.benefit];else s.vals[q.benefit]=q.vals[v];
      track("question_answered",{pregunta:q.id,respuesta:skip?null:v,prefiero_no_decirlo:skip,generada_por_ia:true});
    }else if(key===q.id){
      const ids=a=>JSON.stringify(pickCustom(a).map(x=>x.id));
      const withA={...s.answers,[q.id]:v},without={...s.answers,[q.id]:""};
      delete s.answers[q.id+"_f"];
      s.answers[q.id]=v;
      track("question_answered",{pregunta:q.id,respuesta:skip?null:v,prefiero_no_decirlo:skip,cambia_recomendacion:ids(withA)!==ids(without)});
    }else{
      s.answers[key]=v;
      track("question_answered",{pregunta:q.id,importe:skip?null:v,prefiero_no_decirlo:skip});

  }

    track("benefit_toggled",{beneficio:id,tipo:it.kind==="fijo"?"fijo":"personalizado",activado:s.on[id]});
    updatePlan();return;
  }
  const ed=e.target.closest("[data-edit]");
  if(ed){const id=ed.dataset.edit;s.open[id]=!s.open[id];updatePlan();return;}
  const st=e.target.closest("[data-step]");
  if(st){
    const id=st.dataset.id,b=B[id],v=val(id),nv=Math.max(b.min,Math.min(b.max,v+Number(st.dataset.step)*b.step));
    if(nv!==v){s.vals[id]=nv;track("estimate_edited",{beneficio:id,valor_anterior:v,valor_nuevo:nv});updatePlan();}
    return;
  }
  const ab=e.target.closest("[data-allbtn]");
  if(ab){s.showAll=!s.showAll;drawAll();return;}
  const ad=e.target.closest("[data-add]");
  if(ad){
    const id=ad.dataset.add,st=main.scrollTop;

  const qi=e.target.closest("[data-qinfo]");

  const inf=e.target.closest("[data-info]");
  if(inf){
    const id=inf.dataset.info,was=!!s.tips[id];endCoach();
    s.tips={};s.tips[id]=!was;
    if(s.tips[id])track("why_opened",{beneficio:id});
    updatePlan();return;
  }
});

  const nAmt=qs.reduce((n,q)=>n+(q.gen?1:q.multi?ahSel().filter(o=>q.follow&&q.follow[o]).length:(q.follow&&q.follow[s.answers[q.id]]?1:0)),0);

const EQ_BIG=[
  {p:300,one:"fin de semana fuera",many:"fines de semana fuera"},
  {p:500,one:"bici nueva",many:"bicis nuevas"},
  {p:600,one:"móvil nuevo",many:"móviles nuevos"},

function rng(seed){let a=0;for(const ch of seed)a=(a*31+ch.charCodeAt(0))|0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pickEq(tot){
  const r=rng(`${Math.round(tot)}|${s.goals.join()}|${s.mode}|${s.t}`),pick=a=>a[Math.floor(r()*a.length)];
  const n=(it,x=tot)=>Math.max(1,Math.round(x/it.p)),txt=(it,k)=>`${k} ${k===1?it.one:it.many}`;
  const ok=it=>n(it)>=2&&n(it)<=(it.one.startsWith("mes")?18:36);

  if(tot>=700&&r()<.45){

    if(bigs.length){const b=pick(bigs),nb=Math.max(1,Math.floor(tot*.6/b.p)),rest=tot-nb*b.p;

  }
  let any=EQ_SMALL.filter(ok);
  /* con importes muy bajos o muy altos se amplía el rango para no quedarse sin equivalencias */
  if(any.length<2)any=EQ_SMALL.filter(i=>tot/i.p>=1&&tot/i.p<=80);

}

  const txt=id=>{const q=qById(id);return q?(s.ai.txtQ[id]||q.text):id;};
  const rows=[
    ["Preguntas",rq.map(txt).join(" · ")||"ninguna",iq.map(txt).join(" · ")||"ninguna"],
    ["Beneficios",rr.map(id=>B[id].name()).join(", ")||"—",ir.map(id=>B[id].name()).join(", ")||"(la IA no respondió: igual que reglas)"],
    ["Ahorro que suma",fmt(tot(rr)),fmt(tot(ir.length?ir:rr))],
    ["Explicación","Plantilla igual para todos",Object.keys(s.ai.whyR).length?"Redactada para esta persona ("+Object.keys(s.ai.whyR).length+")":"Plantilla (la IA no aportó texto)"]
  ];
  el.innerHTML=`<table class="cmpt"><tr><th></th><th>Reglas puras</th><th>Reglas + IA</th></tr>${rows.map(r=>`<tr><th>${r[0]}</th><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</table>`;
}
/* Bucle de aprendizaje (simulado): al activar el plan, los parecidos suman esta activación */
function learn(){
  const c=COHORT[s.mode],N=c.n,ch=[];
  plan.filter(p=>s.on[p.id]).forEach(p=>{
    const fixed=p.kind==="fijo",o=fixed?c[p.id]:(COHORT_B[p.id]||0),nv=(o*N+1)/(N+1);
    if(fixed)c[p.id]=nv;else COHORT_B[p.id]=nv;
    ch.push(`${B[p.id].name()}: ${(o*100).toFixed(2)} % → ${(nv*100).toFixed(2)} %`);
  });
  c.n=N+1;
  AI.log("Aprendizaje","reglas",{motivo:"Se suma esta activación al grupo de empleados parecidos (simulado)",perfiles_parecidos:c.n,uso_actualizado:ch});
}
const aiChip=v=>false?`<span class="aichip${v==="ia"?"":" off"}">${v==="ia"?"✦ Preguntas elegidas por IA":"Motor de reglas (IA no disponible)"}</span>`:"";
const esc=v=>String(v).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
cta.addEventListener("click",async()=>{
  if(s.step===0){
    track("goal_selected",{objetivos:s.goals,principal:s.goals[0]});
    /* al volver a elegir objetivos se parte de cero: nada de lo anterior se arrastra */
    s.answers={};s.ans={};s.extra=[];s.vals={};s.on={};s.open={};s.fold={};s.tips={};s.shown={};s.planSeen=false;s.qtip=null;
    const note=($("#note")&&$("#note").value||"").trim().slice(0,200);
    s.ai={qs:null,recs:null,whyR:{},motQ:{},txtQ:{},dyn:{},trace:[],note};renderTrace();
    const run=++runId;cta.disabled=true;
    main.innerHTML=thinking("Preparando tus preguntas","Solo te preguntamos lo que cambia tu ahorro.");
    await AI.decideQuestions();
    if(run!==runId)return;
    const qs=questions();
    track("ia_decidio_preguntas",{via:s.ai.via,preguntas:qs.map(q=>q.id),objetivos:s.goals});
    if(qs.length)go(1);
    else{track("step2_skipped",{motivo:"la IA no necesita preguntar"});await toPlan();}
  }else if(s.step===1){await toPlan();}
  else if(s.step===2){
    learn();
    track("plan_activated",{beneficios:plan.filter(p=>s.on[p.id]).map(p=>p.id),ahorro_total:Math.round(totalOf()),segundos:Math.round((Date.now()-t0)/1000)});
    s.step=3;head();wrapStart();
  }
});
/* cerrar la "i" al tocar fuera (o con Escape) */
$("#phone").addEventListener("click",e=>{
  if(s&&s.step===1&&s.qtip&&!e.target.closest("[data-qinfo]")&&!e.target.closest(".tip")){s.qtip=null;syncQTips();}
  if(!s||s.step!==2||e.target.closest("[data-info]")||e.target.closest(".tip"))return;
  if(Object.values(s.tips||{}).some(Boolean)){s.tips={};updatePlan();}
},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&s&&s.step===1&&s.qtip){s.qtip=null;syncQTips();}
  if(e.key==="Escape"&&s&&s.step===2&&Object.values(s.tips||{}).some(Boolean)){s.tips={};updatePlan();}});
$("#back").addEventListener("click",()=>{
  runId++;
  if(s.step===2)go(questions().length?1:0);else go(Math.max(0,s.step-1));
});
$("#theme").addEventListener("change",e=>{const v=e.target.value,r=document.documentElement;if(v)r.setAttribute("data-theme",v);else r.removeAttribute("data-theme");});
$("#mode").addEventListener("change",()=>reset());
$("#tramo").addEventListener("change",()=>reset());
$("#catalogo").addEventListener("change",()=>reset());
$("#alta").addEventListener("change",()=>reset());
$("#alta").value=String(new Date().getMonth()+1);
$("#restart").addEventListener("click",()=>reset());
$("#cmpbtn").addEventListener("click",()=>{const o=$("#cmp").classList.toggle("open");$("#cmpbtn").setAttribute("aria-expanded",o);renderCompare();});
$("#aibtn").addEventListener("click",()=>{const o=$("#ailog").classList.toggle("open");$("#aibtn").setAttribute("aria-expanded",o);renderTrace();});
$("#evbtn").addEventListener("click",()=>{const o=$("#log").classList.toggle("open");$("#evbtn").setAttribute("aria-expanded",o);});
function reset(){
  runId++;s=fresh($("#mode").value);plan=[];evs=[];t0=Date.now();counted=false;renderTrace();
  $("#wrapped").hidden=true;$("#end").hidden=true;$("#evn").textContent="0";$("#log").innerHTML="";
  track("onboarding_started",{variante:"B",empresa:"Demo S.L.",modalidad:s.mode});
  go(0);
}
reset();
})();
</script>
